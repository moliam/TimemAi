kind: tool
id: readfile
binding_type: builtin
binding_name: readfile
summary: Read a bounded range from a normal text file.
prompt_synopsis: |
  {"readfile":{"path":"src/main.rs","starter":{"line_nr":20},"ender":{"line_nr":80},"max_bytes":32768}}
  {"readfile":{"path":"logs/app.log","starter":{"byte_nr":0},"ender":{"byte_nr":4095},"max_bytes":4096}}
  {"readfile":{"path":"logs/app.log","max_bytes":4096,"tail_out":true}}
  {"readfile":{"path":"src/main.rs","starter":{"match":"fn main"},"ender":{"match":"}"},"max_bytes":32768}}
description: |
  Prefer `readfile` over shell commands for reading normal text files. Relative
  paths resolve from the current session cwd. The tool is read-only, rejects
  directories and special files, decodes text strictly, and always bounds the
  returned content. Set `tail_out=true` to retain the end of an oversized
  selected range instead of its beginning. Each read has a default execution
  timeout of 10 seconds.
input_schema: |
  {
    "type": "object",
    "required": ["path"],
    "properties": {
      "path": {"type": "string", "description": "Absolute path or path relative to the current session cwd."},
      "encoding": {"type": "string", "description": "WHATWG encoding label such as utf-8, utf-16le, utf-16be, gbk, big5, shift_jis, or windows-1252. Default: utf-8 with BOM detection."},
      "starter": {
        "type": "object",
        "description": "Inclusive start selector; exactly one field is allowed.",
        "properties": {
          "line_nr": {"type": ">0 integer", "description": "1-based inclusive line number."},
          "byte_nr": {"type": ">=0 integer", "description": "0-based inclusive original-file byte number."},
          "match": {"type": "string", "description": "Start at the first exact string match."}
        }
      },
      "ender": {
        "type": "object",
        "description": "Inclusive end selector; exactly one field is allowed.",
        "properties": {
          "line_nr": {"type": ">0 integer", "description": "1-based inclusive line number; values beyond EOF clamp to the actual last line."},
          "byte_nr": {"type": ">=0 integer", "description": "0-based inclusive original-file byte number."},
          "match": {"type": "string", "description": "End after the last complete exact match in the max_bytes window."}
        }
      },
      "max_bytes": {"type": ">0 integer", "description": "Maximum returned UTF-8 content bytes. Default and maximum 32768."},
      "tail_out": {"type": "boolean", "description": "When true, an oversized selected range retains its ending and places a truncation notice before the content. Default: false."}
    }
  }
example_json: |
  {
    "readfile": {
      "path": "src/main.rs",
      "starter": {"line_nr": 20},
      "ender": {"line_nr": 80},
      "max_bytes": 32768
    }
  }
