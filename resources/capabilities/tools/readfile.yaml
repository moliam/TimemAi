kind: tool
id: readfile
binding_type: builtin
binding_name: readfile
summary: Read a bounded range from a normal text file.
description: |
  Please use `readfile` instead of shell commands when reading text files; the Runtime can
  better monitor and serve you through this tool. Relative
  paths resolve from the current session cwd. The tool is read-only, rejects
  directories and special files, decodes text strictly, and always bounds the
  returned content. Set `tail_out=true` to retain the end of an oversized
  selected range instead of its beginning. Each read has a default execution
  timeout of 10 seconds.
  Returns the selected text plus canonical path, encoding, byte and line
  range, and whether the selected content was limited; invalid selectors or
  unsafe, binary, oversized, missing, or undecodable files return structured errors.
input_schema: |
  {
    "type": "object",
    "required": ["path"],
    "additionalProperties": false,
    "properties": {
      "path": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty absolute path or path relative to the current session cwd."},
      "encoding": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "WHATWG encoding label such as utf-8, utf-16le, utf-16be, gbk, big5, shift_jis, or windows-1252. Default: utf-8 with BOM detection."},
      "starter": {
        "type": "object",
        "description": "Inclusive start selector. Set exactly one property; never send line_nr, byte_nr, and match together.",
        "minProperties": 1,
        "maxProperties": 1,
        "additionalProperties": false,
        "properties": {
          "line_nr": {"type": "integer", "minimum": 1, "description": "1-based inclusive line number."},
          "byte_nr": {"type": "integer", "minimum": 0, "description": "0-based inclusive original-file byte number."},
          "match": {"type": "string", "minLength": 1, "description": "Non-empty exact string; at most 65536 UTF-8 bytes. Start at its first match."}
        },
        "oneOf": [
          {"required": ["line_nr"]},
          {"required": ["byte_nr"]},
          {"required": ["match"]}
        ]
      },
      "ender": {
        "type": "object",
        "description": "Inclusive end selector. Set exactly one property; never send line_nr, byte_nr, and match together.",
        "minProperties": 1,
        "maxProperties": 1,
        "additionalProperties": false,
        "properties": {
          "line_nr": {"type": "integer", "minimum": 1, "description": "1-based inclusive line number; values beyond EOF clamp to the actual last line."},
          "byte_nr": {"type": "integer", "minimum": 0, "description": "0-based inclusive original-file byte number."},
          "match": {"type": "string", "minLength": 1, "description": "Non-empty exact string; at most 65536 UTF-8 bytes. End after its last complete match in the bounded read window."}
        },
        "oneOf": [
          {"required": ["line_nr"]},
          {"required": ["byte_nr"]},
          {"required": ["match"]}
        ]
      },
      "tail_out": {"type": "boolean", "description": "Controls which side of an oversized selected range is retained. True retains the ending; false retains the beginning. Default: false. Truncation facts are reported in runtime metadata, not inserted into content."}
    }
  }
example_json: |
  {
    "readfile": {
      "path": "src/main.rs",
      "starter": {"line_nr": 20},
      "ender": {"line_nr": 80}
    }
  }
