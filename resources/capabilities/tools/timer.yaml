kind: tool
id: timer
binding_type: builtin
binding_name: timer
summary: Let the runtime schedule timed prompts that arrive as new turns when due, surviving compression and restart.
description: |
  Use this tool to create or delete scheduled timers. Each timer carries a
  prompt; when due, the runtime delivers the prompt as new user-visible input (a new turn when idle,
  or the next interaction batch when a turn is active). Timers survive context compression and
  session restart because the firing authority lives in the runtime host, not the model context.
  IMPORTANT: For very complex tasks and multi-agent cooperation, a repeated timer whose prompt carries the core direction, key objectives, and genuine user needs plays a critical role, helping keep the business on the right track. It can also continue work in case of a careless task finish because it can actively wake.

  ops:
  - new: create a timer. `prompt` is required. `mode` is "once" (default), "repeat",
    or "trigger".
    `queue_timeout` (integer, minutes, default 0) controls delivery timing. 0 never queues:
    the fired prompt is delivered immediately; an active turn receives it as an immediate
    supplement and an otherwise idle session starts a new turn directly, even ahead of
    queued messages. With a positive value, a busy session queues the fired prompt behind
    pending messages and waits at most that many minutes; on timeout it is delivered
    directly, out of queue order.
    For "once", exactly one of `after_ms` (relative delay from creation) or `at` (absolute
    ISO-RFC3339 UTC instant) is required. For "repeat", one of `after_ms`/`at` plus `interval_ms`
    is required; the prompt refires every interval_ms. `name` is optional and auto-generated as
    timer0, timer1, ... when omitted.
    For "trigger", `trigger` selects the system event that fires the prompt and the
    schedule fields (after_ms/at/interval_ms) are forbidden. A trigger timer stays
    armed and fires EVERY time the event occurs until deleted via `del`:
    - "session_idle": a turn just ended because the model called task_finished
      (cancelled or failed turns do not fire it).
    - "after_compression": this session's context compression just completed.
    Trigger timers survive compression and restart like every timer.
    WARNING: the turn started by a fired prompt also ends through task_finished (and can
    compress), firing the same trigger again - a prompt that neither deletes its timer nor
    bounds its work creates an endless wake loop.
  - del: delete a timer by `name`. No error if the name does not exist only via
    explicit error text.

  The runtime host computes the concrete fire time and owns scheduling; this tool only records the
  intent. Do not use timers for sub-second delays or as a substitute for direct tool calls.

  When a timer fires, its prompt is carried into the model request as user input (a new turn when
  idle, or the next interaction batch when a turn is active). The prompt IS the work assignment for
  that future run: if the user's requirement is vague or incomplete, clarify it with the user BEFORE
  creating the timer, then encode the agreed task in a self-contained prompt.
input_schema: |
  {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "op": {"type":"string","enum":["new","del"],"description":"Timer operation."},
      "prompt": {"type":"string","description":"Prompt text delivered when the timer fires. Required for new."},
      "name": {"type":"string","description":"Optional stable handle name for new (auto-named timer0/timer1/... when omitted); required for del."},
      "mode": {"type":"string","enum":["once","repeat","trigger"],"description":"once fires a single time (default); repeat refires every interval_ms; trigger fires on a system event selected by `trigger`."},
      "trigger": {"type":"string","enum":["session_idle","after_compression"],"description":"Required for mode=trigger, forbidden otherwise. session_idle fires after the model ends a turn via task_finished; after_compression fires after this session's context compression completes."},
      "after_ms": {"type":"integer","description":"Relative delay from creation in milliseconds for the first fire."},
      "at": {"type":"string","description":"Absolute first-fire instant as ISO-RFC3339 UTC, e.g. 2026-01-01T09:00:00Z."},
      "interval_ms": {"type":"integer","description":"Refire period in milliseconds. Required for repeat; invalid for once."},
      "queue_timeout": {"type":"integer","description":"Optional, minutes, default 0. 0 never queues: the fired prompt is delivered immediately (an active turn receives it as an immediate supplement, an idle session starts a new turn directly). With a positive value a busy session queues the fired prompt and waits at most this many minutes; on timeout it is delivered directly."}
    },
    "required": ["op"]
  }
example_json: |
  {"timer":{"op":"new","prompt":"Compression just completed: verify the session work file still covers the active goal, then continue it.","mode":"trigger","trigger":"after_compression"}}
