kind: tool
id: task_finished
binding_type: builtin
binding_name: task_finished
summary: Explicitly declare that all work for the current user turn is complete and deliver the final answer.
description: |
  Call this tool when all user's valid asked task is finished. Do not call it
  while any work, verification, or pending question remains; keep using other tools
  instead. The `summary` must be a final answer containing complete, polished, summarized knowledge,
  not a placeholder or progress note. Neatly organize the answer with lists/table, etc.
  Provide the summary in the user's language.
input_schema: |
  {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "summary": {"type":"string","minLength":1,"pattern":"\\S","description":"The complete final user-facing answer."}
    },
    "required": ["summary"]
  }
example_json: |
  {"task_finished":{"summary":"All checks passed; the report is saved at docs/report.md."}}
