kind: tool
id: self_tool
binding_type: builtin
binding_name: self_tool
summary: Locate Timem runtime resources, change cwd, or inspect effective configuration.
description: |
  Use this tool when work requires information about Timem itself or when the
  current prompt context working directory should be queried or changed.
  Prefer it over inferring runtime identity from process tables, guessed
  paths, or environment variables: one type=path call answers which MEM/space
  (space_dir, memory_dir, sessions_dir), executable, and process cwd serve
  this session, plus model_endpoints_file, config, and audit locations;
  type=params reports pid, model, api/response protocols, token limits,
  timeouts, and approval mode. Use cwd without new_path to query the current
  prompt-context directory, or with new_path to change the directory used by
  later local tools; on success it returns `CWD changed to: ...` so later
  local command and readfile actions use the canonical path. Secrets are
  never returned.
input_schema: |
  {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "type": {
        "type": "string",
        "enum": ["path", "cwd", "params"],
        "description": "Self-information class or cwd-change operation."
      },
      "new_path": {
        "type": "string",
        "minLength": 1,
        "pattern": "\\S",
        "description": "Optional new prompt-context directory for type=cwd. Omit to query the current directory. Relative paths resolve from the current prompt-context cwd."
      }
    },
    "required": ["type"],
    "allOf": [
      {
        "if": {"properties": {"type": {"enum": ["path", "params"]}}, "required": ["type"]},
        "then": {"not": {"required": ["new_path"]}}
      }
    ]
  }
example_json: |
  {
    "self_tool": {
      "type": "path"
    }
  }
