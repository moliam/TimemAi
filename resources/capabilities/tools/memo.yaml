kind: tool
id: memo
binding_type: builtin
binding_name: memo
summary: Let the runtime hold one persistent reminder memo for long-running work so it can remind you after interruption or compression.
description: |
  Use this tool to record/update your goals with the help of the runtime to better accomplish current turn, especially when the user's task requires long-running, step-by-step, multi-round of work. Distill
  the user's demands/goals, constraints, methodology as your work anchor into one concise memo
  sentence. An agent holds ONE memo.
  IMPORTANT: 1. the runtime re-injects this memo after context compression, so use memo to keep your goal anchored; otherwise you may lose the thread after compression. 2. memo is PER-TURN tool, runtime will forcely delete it on user's manual stop. So use current session's work file(Timem.md) to complementarily record cross-turn's persistent work rules, really heavy goals/plans.

  ops:
  - create: create a new memo. Any existing memo is replaced. The memo should capture goals rather than planned steps.
  - update: overwrite/refresh the current memo content.
  - delete: delete the current memo. No error if none exists.

  IMPORTANT: before all goals are fully done and declaring task finish, you MUST
  delete the memo. You cannot finish some planned intermediate steps and declare work is done unless user asks.
input_schema: |
  {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "op": {"type":"string","enum":["create","update","delete"],"description":"Memo operation."},
      "text": {"type":"string","description":"Refined long-task reminder text. Required for create/update."}
    },
    "required": ["op"]
  }
example_json: |
  {"memo":{"op":"create","text":"1. Long task: refactor the architecture of xxx to achieve the new design in xxx.md; 2. after refactor, fix the bug xxx."}}
