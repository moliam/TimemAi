kind: tool
id: capmgr
binding_type: builtin
binding_name: capmgr
summary: Manage capability tools and skills.
description: |
  Capability manager. Do not list capabilities for ordinary user tasks. Use
  op=list only when the user asks about available capabilities, or when you need
  to discover optional skills/tool details not already visible in the catalog.
  Use op=load when a specific listed skill body or tool detail is needed.
  Use op=job_status or op=job_cancel for background jobs started by registered
  command-bound tools. Do not use these for local command jobs; the platform command tool returns
  pid and the runtime injects running job updates.
  Always provide op. list: optional kind=all|tool|skill. load: provide kind and
  id. job_status/job_cancel: provide job_id; for job_status choose timeout_ms
  yourself (0 means immediate check, max 15000).
  list returns available capability headers; load returns a skill body or tool
  detail when you need more than the static catalog; job_status returns
  running with partial output, finished with exit code and bounded output, or
  cancelled; job_cancel returns cancelled, already_completed, or job_not_found.
input_schema: |
  {
    "type": "object",
    "required": ["op"],
    "additionalProperties": false,
    "properties": {
      "op": {
        "type": "string",
        "enum": ["list", "load", "job_status", "job_cancel"],
        "description": "Capability manager operation."
      },
      "kind": {
        "type": "string",
        "enum": ["all", "tool", "skill"],
        "description": "Capability kind. all is valid only for list; load accepts tool or skill."
      },
      "id": {
        "type": "string",
        "minLength": 1,
        "pattern": "\\S",
        "description": "Capability id; required for load."
      },
      "job_id": {
        "type": "string",
        "minLength": 1,
        "pattern": "\\S",
        "description": "Background job id returned by a registered command-bound tool."
      },
      "timeout_ms": {
        "type": "integer",
        "minimum": 0,
        "maximum": 15000,
        "description": "Wait budget for job_status; 0 means immediate check, max 15000."
      }
    },
    "x-required-when": [
      {"field": "op", "values": ["load"], "required": ["kind", "id"]},
      {"field": "op", "values": ["job_status", "job_cancel"], "required": ["job_id"]}
    ],
    "oneOf": [
      {"properties": {"op": {"enum": ["list"]}, "kind": {"enum": ["all", "tool", "skill"]}}},
      {"properties": {"op": {"enum": ["load"]}, "kind": {"enum": ["tool", "skill"]}}, "required": ["kind", "id"]},
      {"properties": {"op": {"enum": ["job_status"]}}, "required": ["job_id"]},
      {"properties": {"op": {"enum": ["job_cancel"]}}, "required": ["job_id"]}
    ]
  }
example_json: |
  {
    "capmgr": {
      "op": "load",
      "kind": "skill",
      "id": "xx_skill_id"
    }
  }
