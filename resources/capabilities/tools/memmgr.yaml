kind: tool
id: memmgr
binding_type: builtin
binding_name: memmgr
summary: Unified local memory manager.
description: |
  Unified local memory manager. Use type=durable for long-lived user facts,
  type=raw_chat for UI-visible chat transcript, type=scratch for temporary notes.
  Always include type and op, then fill only the arguments that operation needs:
  Use sql for durable reads (read-only, limited to memories table
  inspection/search, optional params); search_text for raw_chat and scratch
  search ops; content for durable writes and scratch notes; id for
  read/update/delete; and expected_version from a previous durable sql result
  before updating or deleting an existing durable row.
  Writes return ids/versions; unsafe writes return conflict or error strings.
  memory_conflict means the durable row version changed: read the row again
  with durable sql before deciding whether to retry, merge, or report the conflict.
input_schema: |
  {
    "type": "object",
    "required": ["type", "op"],
    "additionalProperties": false,
    "properties": {
      "type": {
        "type": "string",
        "enum": ["durable", "raw_chat", "scratch"],
        "description": "Memory surface: durable user facts, UI-visible raw chat, scratch notes"
      },
      "op": {
        "type": "string",
        "enum": ["schema", "sql", "insert", "update", "upsert", "delete", "search", "write", "read"],
        "description": "Operation. durable: schema|sql|insert|update|upsert|delete; raw_chat: search|delete; scratch: search|write|read|delete"
      },
      "search_text": {"type": "string", "description": "Search text; empty is allowed for raw_chat/scratch recent listing."},
      "scope": {"type": "string", "enum": ["current_session", "session", "global"], "description": "raw_chat search scope; defaults to current_session."},
      "session_id": {"type": "string", "description": "Required only when scope=session."},
      "sql": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty SELECT/WITH SELECT/PRAGMA table_info(memories) only."},
      "params": {"type": "array", "items": {"anyOf": [{"type": "string"}, {"type": "number"}, {"type": "boolean"}]}, "description": "Array of string, number, or boolean values matching SQL ? placeholders exactly."},
      "id": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty memory id, chat turn_id, or scratch id depending on type/op."},
      "expected_version": {"type": "integer", "minimum": 0, "description": "Durable row version from sql results; required when modifying/deleting an existing durable row."},
      "content": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty content required for durable insert/update/upsert and scratch kind=notes."},
      "kind": {"type": "string", "enum": ["notes"], "description": "Scratch write mode."},
      "label": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty short retrieval label for scratch write."},
      "after_ms": {"type": "integer", "description": "Inclusive lower created_at_ms bound for raw_chat."},
      "before_ms": {"type": "integer", "description": "Exclusive upper created_at_ms bound for raw_chat."},
      "limit": {"type": "integer", "minimum": 1, "maximum": 200, "description": "Result cap. SQL reads return at most 200 rows; raw_chat and scratch searches return at most 50. Default: 5."}
    },
    "allOf": [
      {
        "if": {"properties": {"type": {"enum": ["durable"]}}, "required": ["type"]},
        "then": {"properties": {"op": {"enum": ["schema", "sql", "insert", "update", "upsert", "delete"]}}}
      },
      {
        "if": {"properties": {"type": {"enum": ["raw_chat"]}}, "required": ["type"]},
        "then": {"properties": {"op": {"enum": ["search", "sql", "delete"]}}}
      },
      {
        "if": {"properties": {"type": {"enum": ["scratch"]}}, "required": ["type"]},
        "then": {"properties": {"op": {"enum": ["search", "write", "read", "delete"]}}}
      }
    ],
    "x-required-when": [
      {"when": {"type": "durable", "op": "sql"}, "required": ["sql"]},
      {"when": {"type": "durable", "op": ["insert", "upsert"]}, "required": ["content"]},
      {"when": {"type": "durable", "op": "update"}, "required": ["id", "content"]},
      {"when": {"type": "durable", "op": "delete"}, "required": ["id"]},
      {"when": {"type": "scratch", "op": "write"}, "required": ["kind", "label"]},
      {"when": {"type": "scratch", "kind": "notes"}, "required": ["content"]},
      {"when": {"type": "scratch", "op": ["read", "delete"]}, "required": ["id"]}
    ],
    "x-required-any-when": [
      {"when": {"type": "raw_chat", "op": "delete"}, "required": ["id", "search_text"]}
    ]
  }
example_json: |
  {
    "memmgr": {
      "type": "durable",
      "op": "sql",
      "sql": "SELECT id, version, content FROM memories WHERE content LIKE ? LIMIT 5",
      "params": ["%memory-topic%"],
      "limit": 5
    }
  }
