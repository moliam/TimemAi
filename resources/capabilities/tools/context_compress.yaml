kind: tool
id: context_compress
binding_type: builtin
binding_name: context_compress
summary: Compress selected dynamic prompt deltas while preserving an essential summary.
prompt_synopsis: |
  {"context_compress":{"discard":["pd_1"],"offload":["pd_2"],"summary":"Essential active state..."}}
description: |
  Compress current context to free context space. Well-designed context compression not only frees up context space, but also boosts work quality.
  !!! When a context threshold warning is triggered, target at most 25% of the model input window. Preserve only useful state (including any previous compressed summary) and discard superseded context by its visible delta id; provider-native tool exchanges share the id of their owning delta. The runtime may force at most one immediate follow-up compression when the first result remains above target. You can also proactively compress context during work.
  You can also offload big deltas into scratch memory if it is highly valuable. Compression should be ultra-dense, low-loss, and adhere strictly to the dimensions below (keep titles), based on previous compression (if any) and current context:
  * **Design Blueprint**: Authoritative design or root-doc and settled interface contracts; important design rule corrected by user.
  * **Roadmap Coordinates**: High level work plan, active milestone and the current task item
  * **User Corrections**: user-clarified misconceptions, misguided approaches, prioritization, useful methodology, and working criteria, user mandated always-keep memory.
  * **Toolchain & Env**: toolchain, env vars, and connections, other working material info, etc.
  * **Anti-Patterns & Negative Findings**: Approaches, libraries, or logic proven invalid and why (hard "Do Not Repeat" flags).
  * **Execution & Detail Gates**: Criteria for when to mock vs. implement; validation checks required before exiting this iteration.
  * **Curr state**: curr work status, progress, artifacts, etc. Important: still running jobs, to-be cleaned temp target
  * **Next work**:  next planned action

  When combined with other capability calls, `context_compress` must be the first
  call. Later calls run only after compression succeeds.
prompt_input: |
  Use only runtime-provided dynamic delta ids. Provide at least one id in
  discard or offload, plus a non-empty summary.
prompt_result: |
  On success, ordinary compression does not reinsert a verbose action result.
  A successful offload exposes only the actionable scratch_id for later memmgr
  scratch read. Validation or persistence failures retain a standard result.
input_schema: |
  {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "discard": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1, "pattern": "\\S"}, "description": "Non-empty stale delta ids to remove."},
      "offload": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1, "pattern": "\\S"}, "description": "Non-empty important bulky delta ids to save to scratch before removal."},
      "summary": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty compressed retained state for subsequent work."}
    },
    "required": ["summary"],
    "x-required-any": [["discard", "offload"]]
  }
example_json: |
  {
    "context_compress": {
      "discard": ["pd_1", "pd_3"],
      "offload": ["pd_2"],
      "summary": "The active task is ... Current progress ... Next steps ..."
    }
  }
