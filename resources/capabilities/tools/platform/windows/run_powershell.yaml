kind: tool
id: run_powershell
binding_type: builtin
binding_name: run_powershell
requires_host: powershell_execution
summary: Run local PowerShell commands.
prompt_synopsis: |
  {"run_powershell":{"cmd":"Get-ChildItem -Force","timeout_ms":5000}}
  {"run_powershell":{"cmd":"cargo test","timeout_ms":120000,"tail_out":true}}
  {"run_powershell":{"loop_cmd":"if (Test-Path build\\done) { exit 0 } else { exit 1 }","interval_ms":1000,"loop_timeout_ms":120000,"once_timeout_ms":5000}}
description: |
  RUNTIME's local command environment is ({{RUN_POWERSHELL_HOST_ENVIRONMENT}}).
  `run_powershell` runs a PowerShell command on the local Windows machine and
  captures its result. Use PowerShell syntax and Windows paths.
  Timem applies the shared result gate before adding command evidence to model
  context. It supports normal, background, and polling execution.
  `timeout_ms` is only how long Timem waits for a normal command. It is not a
  kill deadline. If the wait budget is reached, Timem returns the pid and stops
  waiting while the process may still be running. Set `tail_out=true` to retain
  the end of oversized output, which is useful for compiler and test summaries.
  Accomplish goals by intelligently choosing and organizing commands. Revert
  temporary changes promptly. For polling, make `loop_cmd` explicitly exit 0
  when the condition is satisfied and nonzero otherwise, for example:
  `if (Test-Path path) { exit 0 } else { exit 1 }`.
  For long local work that should keep running across interaction rounds, use
  `background=true`. Runtime rejects unmanaged process detachment. Background
  and timeout jobs return a pid; inspect or stop only jobs owned by this runtime.
prompt_input: |
  Choose exactly one mode. For a normal/background command, provide cmd and do
  not provide loop_cmd or interval_ms; timeout_ms, background, and tail_out are
  optional. For polling, provide loop_cmd with interval_ms, omit cmd, and keep
  background false or absent. loop_timeout_ms is the total polling wait budget;
  once_timeout_ms is the per-check command timeout.
prompt_result: |
  Normal and polling execution use the standard structured result with lifecycle
  `status`, `exit_code`, and stdout/stderr. In polling mode, `exit_code` belongs
  to the last `loop_cmd`, not automatically to the task being waited on. Timem's
  shared result gate bounds only the model-visible evidence according to
  tail_out. Background returns `pid=..., now keeps running in background`.
  A timeout does not automatically kill the command. Track, inspect, and clean
  up still-running pids, and confirm ownership before terminating one.
input_schema: |
  {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "cmd": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty PowerShell command for normal or background mode. Mutually exclusive with loop_cmd."},
      "loop_cmd": {"type": "string", "minLength": 1, "pattern": "\\S", "description": "Non-empty PowerShell polling check command. Runtime re-runs it until it exits with code 0. Mutually exclusive with cmd and requires interval_ms."},
      "timeout_ms": {"type": "integer", "minimum": 1, "description": "Normal command wait budget in milliseconds. Default: 5000."},
      "loop_timeout_ms": {"type": "integer", "minimum": 1, "description": "Total polling wait budget in milliseconds. Default: 600000 when loop_cmd is present."},
      "once_timeout_ms": {"type": "integer", "minimum": 1, "description": "Per-check timeout in polling mode. Default: 5000."},
      "interval_ms": {"type": "integer", "minimum": 1, "description": "Polling interval in milliseconds. Required with loop_cmd and invalid with cmd."},
      "background": {"type": "boolean", "description": "When true, runtime continues interaction without blocking on the action, returning a pid for future reference. Use it for persistent long-running commands that should keep running across interaction rounds."},
      "tail_out": {"type": "boolean", "description": "When true, oversized output retains its ending and places the truncation notice before the retained content. Default: false."}
    },
    "x-required-any": [["cmd", "loop_cmd"]],
    "oneOf": [
      {"required": ["cmd"]},
      {"required": ["loop_cmd"]}
    ],
    "allOf": [
      {
        "if": {"required": ["loop_cmd"]},
        "then": {
          "required": ["interval_ms"],
          "properties": {"background": {"enum": [false]}}
        }
      },
      {
        "if": {"required": ["interval_ms"]},
        "then": {"required": ["loop_cmd"]}
      }
    ]
  }
example_json: |
  {
    "run_powershell": {
      "cmd": "Get-ChildItem -Recurse -File | Measure-Object | Select-Object -ExpandProperty Count",
      "timeout_ms": 5000
    }
  }
