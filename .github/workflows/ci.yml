name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "0.9"
      - "1.0"
  pull_request:
    branches:
      - main
      - "0.9"
      - "1.0"

permissions:
  contents: read

# CI-only compiler policy. Local Cargo commands keep their normal profiles;
# install.sh continues to produce optimized release binaries.
env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OS dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Remove problematic Microsoft repos that may return 403
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                       /etc/apt/sources.list.d/azure-cli.list
            sudo apt-get update
            sudo apt-get install -y expect
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if ! command -v expect >/dev/null 2>&1; then
              brew update
              brew install expect
            fi
          fi

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: interfaces/web/pnpm-lock.yaml

      - name: Run production CI gate
        shell: bash
        run: scripts/ci.sh

      - name: Upload Timem runtime I/O report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-io-${{ matrix.os }}
          path: target/runtime-io-guard/report.json
          if-no-files-found: warn

  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: interfaces/web/pnpm-lock.yaml

      - name: Validate PowerShell delivery scripts
        shell: pwsh
        run: ./scripts/windows_install_logic_test.ps1

      - name: Rust format
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Rust check and tests
        shell: pwsh
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked -- --test-threads=1

      - name: Web dependencies, tests, and production build
        shell: pwsh
        run: |
          pnpm --dir interfaces/web install --frozen-lockfile
          pnpm --dir interfaces/web test
          pnpm --dir interfaces/web build
          git diff --exit-code -- interfaces/web/dist

      - name: Windows release build
        shell: pwsh
        run: cargo build --locked -p timem_shell -p timem_web --release
