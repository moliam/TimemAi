      .app-loading-mark { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: #111a23; box-shadow: 0 12px 32px #0006; }
      .app-loading-spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #2a3947; border-top-color: #8bc8ba; animation: app-loading-spin 0.9s linear infinite; }
      /* preload.ts sets data-theme before first paint, but module scripts are

      @media (prefers-color-scheme: light) {
        .app-loading { color: #425466; background: #f6f8fa; }
        .app-loading-mark { background: #ffffff; box-shadow: 0 12px 28px #29434d24; }

      }
      :root[data-theme=light] .app-loading { color: #425466; background: #f6f8fa; }
      :root[data-theme=light] .app-loading-mark { background: #ffffff; box-shadow: 0 12px 28px #29434d24; }
      :root[data-theme=light] .app-loading-spinner { border-color: #d5e2e6; border-top-color: #287e68; }
      :root[data-theme=dark] .app-loading { color: #8d9aa7; background: #0c1117; }
      :root[data-theme=dark] .app-loading-mark { background: #111a23; box-shadow: 0 12px 32px #0006; }
      :root[data-theme=dark] .app-loading-spinner { border-color: #2a3947; border-top-color: #8bc8ba; }

      @media (prefers-reduced-motion: reduce) { .app-loading-spinner { animation: none; } }
