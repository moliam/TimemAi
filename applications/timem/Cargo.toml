[package]
name = "timem_web"
build = "build.rs"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "timem"
path = "src/main.rs"

[dependencies]
agent_core = { path = "../../core/agent" }
timem_session = { path = "../../core/session" }
timem_shell = { path = "../../interfaces/shell" }
timem_http_websocket = { path = "../../bridges/http_websocket" }
axum = { version = "0.7", features = ["multipart", "ws"] }
chrono = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
